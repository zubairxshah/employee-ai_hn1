# Gmail Watcher Skill Configuration
name: gmail_watcher
version: "1.0.0"
enabled: true

config:
  labels_to_monitor:
    - INBOX
    - IMPORTANT
  max_results: 10
  processed_messages_log: processed_gmail.txt
  
  # Path to OAuth2 credentials (downloaded from Google Cloud Console)
  # Follow GMAIL_SETUP.md to obtain this file
  credentials_path: D:\prompteng\employee\gmail_credentials.json
  
  # Path to OAuth2 token (generated by gmail_auth.py script)
  token_path: D:\prompteng\employee\.gmail_token.json

# Vault path
vault_path: D:\prompteng\AI_Employee_Vault

# Scan interval (seconds)
scan_interval_seconds: 300
