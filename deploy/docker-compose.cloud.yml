version: "3.8"

services:
  # PostgreSQL for Odoo
  postgres:
    image: postgres:15
    container_name: employee_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Odoo ERP
  odoo:
    image: odoo:17
    container_name: employee_odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_secure_password}
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_addons:/mnt/extra-addons
    ports:
      - "8069:8069"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Cloud Agent
  cloud_agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cloud
    container_name: employee_cloud_agent
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    env_file:
      - cloud.env
    environment:
      AGENT_ROLE: cloud
      AGENT_ID: cloud-oracle-vm
      VAULT_PATH: /app/vault
      ODOO_URL: http://odoo:8069
      VAULT_SYNC_ENABLED: "true"
    volumes:
      - vault_data:/app/vault
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "9000:9000"

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: employee_nginx
    restart: unless-stopped
    depends_on:
      - odoo
      - cloud_agent
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"

  # Certbot for Let's Encrypt
  certbot:
    image: certbot/certbot
    container_name: employee_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  odoo_data:
  odoo_addons:
  vault_data:
  certbot_certs:
  certbot_www:
